name: Audit npm package registry state

on:
  push:
    branches: [feature/node-tapo-thing-cloud]
    paths:
      - ".github/workflows/npm-registry-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Install npm staged-publishing CLI
        run: npm install --global npm@11.21.3
      - name: Read published and staged version metadata
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          echo "=== PUBLIC VERSION LIST AND DIST-TAGS ==="
          npm view "$PACKAGE_NAME" versions dist-tags --json
          for VERSION in 0.2.0-beta.13 0.2.0-beta.14 0.2.0-beta.15 0.2.0-beta.16; do
            echo "=== PUBLISHED METADATA: $VERSION ==="
            npm view "$PACKAGE_NAME@$VERSION" time _npmUser _npmVersion _nodeVersion dist --json
          done
          echo "=== STAGED VERSIONS ==="
          npm stage list "$PACKAGE_NAME" --json
