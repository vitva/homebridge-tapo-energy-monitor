name: CI

on:
  push:
    branches: [main, feature/node-tapo-thing-cloud]
  pull_request:
    branches: [main, feature/node-tapo-thing-cloud]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm install --ignore-scripts
      - run: npm test
      - run: npm run lint
      - name: Verify Homebridge 2 ESM plugin loading
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import 'homebridge';
          import pluginInitializer from './index.js';

          assert.equal(typeof pluginInitializer, 'function');
          const registrations = [];
          pluginInitializer({
            registerPlatform: (...args) => registrations.push(args),
          });
          assert.equal(registrations.length, 1);
          assert.equal(registrations[0][0], 'homebridge-tapo-energy-monitor');
          assert.equal(registrations[0][1], 'TapoEnergyMonitor');
          assert.equal(typeof registrations[0][2], 'function');
          console.log('Homebridge 2 ESM loader compatibility passed.');
          NODE
      - name: Build and install package in isolated Homebridge runtime
        if: matrix.node-version == 22 || matrix.node-version == 26
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/package" "$RUNNER_TEMP/homebridge"
          npm pack --pack-destination "$RUNNER_TEMP/package"
          PACKAGE="$(find "$RUNNER_TEMP/package" -maxdepth 1 -name '*.tgz' -print -quit)"
          test -n "$PACKAGE"
          cd "$RUNNER_TEMP/homebridge"
          npm init -y >/dev/null
          npm install --ignore-scripts "$PACKAGE" homebridge@2.5.0
          mkdir -p "$RUNNER_TEMP/homebridge-data"
          cat > "$RUNNER_TEMP/homebridge-data/config.json" <<'JSON'
          {
            "bridge": {
              "name": "Tapo Energy Isolated Runtime",
              "username": "CC:22:3E:E3:CE:30",
              "port": 51926,
              "pin": "031-45-154"
            },
            "platforms": [
              {
                "platform": "TapoEnergyMonitor",
                "name": "Tapo Energy Monitor",
                "simulationMode": false,
                "pollingIntervalSeconds": 60
              }
            ]
          }
          JSON
          set +e
          timeout 20s ./node_modules/.bin/homebridge \
            -U "$RUNNER_TEMP/homebridge-data" \
            > "$RUNNER_TEMP/homebridge-runtime.log" 2>&1
          EXIT_CODE=$?
          set -e
          cat "$RUNNER_TEMP/homebridge-runtime.log"
          if [ "$EXIT_CODE" -ne 124 ]; then
            echo "Homebridge exited unexpectedly (code $EXIT_CODE)." >&2
            exit 1
          fi
          grep -q "Simulation is disabled" "$RUNNER_TEMP/homebridge-runtime.log"
          grep -q "is running on port" "$RUNNER_TEMP/homebridge-runtime.log"

          # Exercise the real Homebridge Matter API and endpoint registration,
          # not only a mocked api.matter object in unit tests.
          mkdir -p "$RUNNER_TEMP/homebridge-matter-data"
          cat > "$RUNNER_TEMP/homebridge-matter-data/config.json" <<'JSON'
          {
            "bridge": {
              "name": "Tapo Energy Matter CI",
              "username": "CC:22:3E:E3:CE:31",
              "port": 51927,
              "pin": "031-45-155",
              "matter": { "port": 5542 }
            },
            "platforms": [
              {
                "platform": "TapoEnergyMonitor",
                "name": "Tapo Energy Monitor",
                "simulationMode": true,
                "pollingIntervalSeconds": 3600,
                "simulatedDevices": [
                  { "id": "ci-meter", "name": "CI Meter", "model": "P110M", "powerW": 42 }
                ]
              }
            ]
          }
          JSON
          set +e
          timeout --kill-after=5s 25s ./node_modules/.bin/homebridge \
            -U "$RUNNER_TEMP/homebridge-matter-data" \
            > "$RUNNER_TEMP/homebridge-matter-runtime.log" 2>&1
          MATTER_EXIT_CODE=$?
          set -e
          cat "$RUNNER_TEMP/homebridge-matter-runtime.log"
          if [ "$MATTER_EXIT_CODE" -ne 124 ] && [ "$MATTER_EXIT_CODE" -ne 137 ]; then
            echo "Matter-enabled Homebridge exited unexpectedly (code $MATTER_EXIT_CODE)." >&2
            exit 1
          fi
          grep -q "Matter virtual energy sensor registered" "$RUNNER_TEMP/homebridge-matter-runtime.log"
          grep -q "\[MATTER SIMULATION\]" "$RUNNER_TEMP/homebridge-matter-runtime.log"
      - if: matrix.node-version == 26
        run: mkdir -p artifacts && npm pack --pack-destination artifacts
      - if: matrix.node-version == 26
        uses: actions/upload-artifact@v4
        with:
          name: homebridge-tapo-energy-monitor-npm-package
          path: artifacts/*.tgz
          if-no-files-found: error
          retention-days: 14
