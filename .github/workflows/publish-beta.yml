name: Publish beta to npm

on:
  workflow_dispatch:
    inputs:
      confirm_publish:
        description: Publish this beta package to npm
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish-beta:
    if: github.ref == 'refs/heads/feature/node-tapo-thing-cloud' && inputs.confirm_publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Verify npm credentials
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "Repository Actions secret NPM_TOKEN is not configured." >&2
            exit 1
          fi
      - run: npm install --ignore-scripts
      - run: npm test
      - run: npm run lint
      - name: Verify package contents
        run: npm pack --dry-run
      - name: Publish beta
        run: npm publish --access public --tag beta
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
