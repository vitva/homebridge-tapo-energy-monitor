name: Publish beta to npm

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-beta:
    if: github.ref == 'refs/heads/feature/node-tapo-thing-cloud' || github.ref == 'refs/heads/fix/node-only-tapo-cloud-beta15'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Verify npm credentials
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "Repository Actions secret NPM_TOKEN is not configured." >&2
            exit 1
          fi
      - run: npm install --ignore-scripts
      - run: npm test
      - run: npm run lint
      - name: Verify package contents
        run: npm pack --dry-run
      - name: Install npm CLI with staged publishing support
        run: npm install --global npm@11.21.3
      - name: Preflight npm version and staged candidates
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          echo "Checking published version $PACKAGE_NAME@$PACKAGE_VERSION..."
          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version >/dev/null 2>&1; then
            echo "Version $PACKAGE_NAME@$PACKAGE_VERSION already exists in the public registry; refusing to stage." >&2
            exit 1
          fi
          echo "Checking existing staged versions..."
          STAGED="$(npm stage list "$PACKAGE_NAME" --json)"
          echo "$STAGED"
          if printf '%s' "$STAGED" | grep -Fq "$PACKAGE_VERSION"; then
            echo "Version $PACKAGE_VERSION already has a staged candidate; refusing to stage again." >&2
            exit 1
          fi
          echo "Preflight passed: no published or currently staged candidate for $PACKAGE_VERSION."
      - name: Stage beta for approval
        run: npm stage publish --access public --tag beta
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
